{% extends 'base.html' %}

{% block title %}Přihlášení - Pokédex{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="pokedex-detail-screen my-4">

      <!-- Nadpis formuláře -->
      <div class="border-bottom border-secondary pb-3 mb-4 text-center">
        <h1 class="h3 fw-bold text-white mb-1">Přihlášení do Pokédexu</h1>
        <p class="text-white-50 small mb-0">Zadejte své údaje pro přístup k účtu</p>
      </div>

      <!-- Formulář -->
      <form action="" method="post" class="pokedex-search-container border-0 p-0 shadow-none bg-transparent mb-0">

        <!-- Uživatelské jméno / E-mail -->
        <div class="mb-3">
          <label for="username" class="stat-label mb-2">Uživatelské jméno nebo e-mail</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="např. AshKetchum"
            required
            autocomplete="username"
          >
        </div>

        <!-- Heslo -->
        <div class="mb-3">
          <label for="password" class="stat-label mb-2">Heslo</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <!-- Zapamatovat si mě -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me">
            <label class="form-check-label text-white-50 small" for="rememberMe">
              Pamatovat si mě
            </label>
          </div>
        </div>

        <!-- Tlačítko Přihlásit -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-pokedex py-2">
            Přihlásit se
          </button>
        </div>
      </form>

      <!-- Spodní odkaz na registraci -->
      <div class="pt-3 border-top border-secondary text-center">
        <p class="small text-white-50 mb-0">
          Nemáte ještě účet? <a href="#" class="text-danger fw-bold text-decoration-none">Zaregistrujte se</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
